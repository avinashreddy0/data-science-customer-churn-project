<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Data Science Elements -->
  <circle cx="150" cy="150" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="480" r="100" fill="rgba(255,255,255,0.1)"/>
  <circle cx="600" cy="100" r="60" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1000" cy="200" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="70" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Grid Pattern for Data Science Theme -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="2"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="2"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="2"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="2"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="2"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="2"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="2"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="2"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">
    Customer Churn Prediction
  </text>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Data Science &amp; Machine Learning Project
  </text>
  
  <!-- Technology Stack Icons and Text -->
  <g transform="translate(600, 350)">
    <!-- PANDAS -->
    <rect x="-580" y="-30" width="150" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="-505" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🐼 PANDAS</text>
    
    <!-- EDA -->
    <rect x="-410" y="-30" width="120" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="-350" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🔍 EDA</text>
    
    <!-- ETL -->
    <rect x="-270" y="-30" width="110" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="-215" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🔄 ETL</text>
    
    <!-- ML -->
    <rect x="-140" y="-30" width="90" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="-95" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🤖 ML</text>
    
    <!-- APP -->
    <rect x="-30" y="-30" width="90" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">📱 APP</text>
    
    <!-- MYSQL -->
    <rect x="70" y="-30" width="120" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="130" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🗄️ MYSQL</text>
    
    <!-- POWER BI -->
    <rect x="200" y="-30" width="150" height="60" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="275" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">📈 POWER BI</text>
  </g>
  
  <!-- Plus Signs Between Technologies -->
  <g fill="white" font-size="28" font-weight="bold" opacity="0.8">
    <text x="190" y="355" text-anchor="middle">+</text>
    <text x="320" y="355" text-anchor="middle">+</text>
    <text x="450" y="355" text-anchor="middle">+</text>
    <text x="560" y="355" text-anchor="middle">+</text>
    <text x="670" y="355" text-anchor="middle">+</text>
    <text x="800" y="355" text-anchor="middle">+</text>
  </g>
  
  <!-- Footer Text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    End-to-End Data Science Pipeline | Predictive Analytics | Business Intelligence
  </text>
  
  <!-- Decorative Chart Elements -->
  <g opacity="0.2">
    <!-- Bar Chart Representation -->
    <rect x="100" y="400" width="40" height="120" fill="white"/>
    <rect x="160" y="440" width="40" height="80" fill="white"/>
    <rect x="220" y="420" width="40" height="100" fill="white"/>
    <rect x="280" y="460" width="40" height="60" fill="white"/>
    
    <!-- Line Chart Representation -->
    <polyline points="950,450 980,420 1010,440 1040,400 1070,410 1100,380" fill="none" stroke="white" stroke-width="4"/>
  </g>
</svg>
